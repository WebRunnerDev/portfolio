<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets the theme class before the first paint, so a dark reload doesn't
         flash light. Key and values match src/shared/lib/theme/theme-storage.ts;
         ThemeProvider takes over once the app loads. The Print CV is always
         light, like `staticData.theme` on its route. -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem("theme")
        } catch (e) {}
        if (/^\/[^/]+\/cv\/print\/?$/.test(location.pathname)) {
          theme = "light"
        } else if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The Worker fills in the title and the other head tags of a page
         under a Lang (worker/README.md › Meta Injection); LangHead removes
         everything marked data-meta once React renders its own. -->
    <title data-meta>WebRunner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
