name: Lighthouse

# Lighthouse CI (mobile, lighthouserc.json) on every public page and /ar.
# Blocking: a budget below its threshold fails the job, and `lighthouse` is a
# required check of `main` (docs/plan.md, stage 6, item 8).
#
# Where it measures (issue #124): the production build of the PR, here in CI,
# served by `vite preview` through the Worker over a local D1 and R2 filled from
# scripts/audit/seed.sql (scripts/audit/server.mjs). Not the Workers Builds
# Preview: Previews sit behind Cloudflare Access, and their shared D1 has no
# content (nor tables until someone migrates it), so the pages there are empty
# or a login screen. Not production after the deploy either: that runs after
# the merge and could not stop the PR. Lighthouse simulates a mobile 4G
# connection, so a local server gives the same budgets; edge latency is what
# this does not see.

on:
  pull_request:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Starts scripts/audit/server.mjs itself (collect.startServerCommand).
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always()
        run: node .github/scripts/lighthouse-summary.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          # The directory name starts with a dot.
          include-hidden-files: true
          retention-days: 14
