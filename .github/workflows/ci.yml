name: CI

# Deploys are not here: Workers Builds (Cloudflare Git integration) deploys
# `main` to production and every other branch to a Preview. See worker/README.md.
# Git hooks can be skipped with --no-verify, so these jobs are the real gate.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm audit --audit-level=high, minus .github/audit-allowlist.json.
      - run: node .github/scripts/npm-audit.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npx wrangler types --check --env-file .dev.vars.example
      - run: npx prettier --check .
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Builds the app and serves it through the Worker (`vite preview`).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Comments on the PR lines that leak a secret.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the commits of the PR, or of the push to main.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every commit of the PR; merge commits are ignored.
      - run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
